<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Alva Court — Desert Top-Down</title>
<style>
  * { margin: 0; padding: 0; }
  body { overflow: hidden; background: #1a1a1a; }
  canvas { display: block; }
  #hud {
    position: absolute; top: 12px; left: 12px;
    color: #eee; font: 13px/1.5 monospace;
    background: rgba(0,0,0,0.8); padding: 12px;
    border-radius: 8px; pointer-events: none;
    border: 1px solid #444;
  }
  #hud b { color: #f0c040; }
  #loading {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #eee; font: 20px monospace;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="hud">
  <b>Alva Court — Desert Top-Down</b><br>
  • Road: 22ft W × 360ft L | Cul-de-sac R: 35ft<br>
  • 4K PBR Asphalt + Noise Overlays | Sun: Southeast<br>
  • Controls: Left=Orbit | Right=Pan | Scroll=Zoom
</div>
<div id="loading">Loading & compositing textures…</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EXRLoader } from 'three/addons/loaders/EXRLoader.js';

/* ── CONFIGURATION ── */
const ROAD_LEN = 360;
const ROAD_W   = 22;
const CDS_R    = 35;
const SW_W     = 68 / 12;   // ~5.67 ft
const CURB_H   = 0.5;

const TILE_SIZE  = 20;
const ROAD_REP_X = ROAD_LEN / TILE_SIZE;
const ROAD_REP_Y = ROAD_W / TILE_SIZE;
const CDS_REP    = (CDS_R * 2) / TILE_SIZE;

/* ── HELPERS ── */

function loadImg(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('Failed to load: ' + src));
    img.src = src;
  });
}

// Seeded PRNG
function seededRng(seed) {
  let s = seed >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 0xffffffff; };
}

// 2-octave value noise — smooth organic patches
function makeNoise(seed) {
  const rng = seededRng(seed);
  const COLS1 = 6, ROWS1 = 6, COLS2 = 14, ROWS2 = 14;
  const g1 = Array.from({ length: (COLS1+1)*(ROWS1+1) }, rng);
  const g2 = Array.from({ length: (COLS2+1)*(ROWS2+1) }, rng);

  function sample(grid, cols, rows, u, v) {
    const x = u * cols, y = v * rows;
    const ix = Math.floor(x), iy = Math.floor(y);
    const fx = x - ix, fy = y - iy;
    const sx = fx*fx*(3 - 2*fx), sy = fy*fy*(3 - 2*fy);
    const i = (r, c) => (r % (rows+1)) * (cols+1) + (c % (cols+1));
    return grid[i(iy,ix)]*(1-sx)*(1-sy) + grid[i(iy,ix+1)]*sx*(1-sy)
         + grid[i(iy+1,ix)]*(1-sx)*sy   + grid[i(iy+1,ix+1)]*sx*sy;
  }

  return (u, v) => sample(g1,COLS1,ROWS1,u,v)*0.65 + sample(g2,COLS2,ROWS2,u,v)*0.35;
}

// Blend overlay onto dest canvas using per-pixel noise-driven alpha
function blendWithNoise(destCtx, overlayImg, size, noiseFn, maxAlpha) {
  const tmp = document.createElement('canvas');
  tmp.width = tmp.height = size;
  const tctx = tmp.getContext('2d');
  tctx.drawImage(overlayImg, 0, 0, size, size);
  const imgData = tctx.getImageData(0, 0, size, size);
  const d = imgData.data;
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const idx = (y * size + x) * 4;
      d[idx+3] = Math.floor(noiseFn(x / size, y / size) * maxAlpha * 255);
    }
  }
  tctx.putImageData(imgData, 0, 0);
  destCtx.drawImage(tmp, 0, 0);
}

// Simple flat overlay at fixed alpha
function blendFlat(destCtx, overlayImg, size, alpha) {
  destCtx.globalAlpha = alpha;
  destCtx.drawImage(overlayImg, 0, 0, size, size);
  destCtx.globalAlpha = 1.0;
}

/* ── LOAD ALL IMAGES ── */
const TEX = 'textures/asphalt/';
const ASP = 'textures/asphalt/';
const CEM = 'textures/cement/';

const [
  aspBase,          // 0 — 4K PBR diffuse
  aspOverlayA,      // 1 — broken asphalt A
  aspOverlayB,      // 2 — broken asphalt B
  cemBase,          // 3 — clean concrete slab
  cemWeathered,     // 4 — martin-van-maaren weathered
  cemCracks,        // 5 — curly cracks texture
] = await Promise.all([
  loadImg(TEX + 'asphalt_02_diff_4k.jpg'),
  loadImg(ASP + 'black-broken-asphalt-texture-background.jpg'),
  loadImg(ASP + 'black-broken-asphalt-texture-background%20(1).jpg'),
  loadImg(CEM + 'cement-concrete-texture-copy-space.jpg'),
  loadImg(CEM + 'martin-van-maaren-l3WPo-bchxk-unsplash.jpg'),
  loadImg(CEM + 'texture-grey-concrete-wall-with-curly-cracks.jpg'),
]);

/* ── COMPOSITE ASPHALT TEXTURE ── */
// Base 4K + two broken asphalt overlays at 30% via Perlin noise
const COMP = 2048;
const aspCanvas = document.createElement('canvas');
aspCanvas.width = aspCanvas.height = COMP;
const actx = aspCanvas.getContext('2d');

// Draw base asphalt
actx.drawImage(aspBase, 0, 0, COMP, COMP);

// Overlay A — organic noise patches at 30% max opacity
blendWithNoise(actx, aspOverlayA, COMP, makeNoise(42), 0.3);

// Overlay B — different noise pattern at 30% max opacity
blendWithNoise(actx, aspOverlayB, COMP, makeNoise(137), 0.3);

/* ── COMPOSITE CEMENT SLAB VARIANTS ── */
// 3 variants: base only, base+weathered, base+cracks — each overlay at 30%
const SLAB_TEX = 512;

function makeCementVariant(overlayImg) {
  const c = document.createElement('canvas');
  c.width = c.height = SLAB_TEX;
  const ctx = c.getContext('2d');
  ctx.drawImage(cemBase, 0, 0, SLAB_TEX, SLAB_TEX);
  if (overlayImg) blendFlat(ctx, overlayImg, SLAB_TEX, 0.3);
  return c;
}

const cemVariants = [
  makeCementVariant(null),          // plain base
  makeCementVariant(cemWeathered),  // base + weathered 30%
  makeCementVariant(cemCracks),     // base + cracks 30%
];

/* ── SCENE SETUP ── */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);

// Top-down camera
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 2000);
camera.position.set(ROAD_LEN / 2, 500, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(ROAD_LEN / 2, 0, 0);
controls.update();

/* ── MATERIALS ── */

// Asphalt — composited diffuse + PBR roughness
function makeAsphaltTex(repX, repY) {
  const tex = new THREE.CanvasTexture(aspCanvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(repX, repY);
  tex.anisotropy = 16;
  return tex;
}

const texLoader = new THREE.TextureLoader();
function loadRepeatTex(path, repX, repY) {
  const tex = texLoader.load(path);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(repX, repY);
  tex.anisotropy = 16;
  return tex;
}

const roadRough = loadRepeatTex(TEX + 'asphalt_02_rough_4k.jpg', ROAD_REP_X, ROAD_REP_Y);
const cdsRough  = loadRepeatTex(TEX + 'asphalt_02_rough_4k.jpg', CDS_REP, CDS_REP);

const matRoad = new THREE.MeshStandardMaterial({
  map: makeAsphaltTex(ROAD_REP_X, ROAD_REP_Y),
  roughnessMap: roadRough,
  roughness: 1.0,
  metalness: 0.0,
});

const matCds = new THREE.MeshStandardMaterial({
  map: makeAsphaltTex(CDS_REP, CDS_REP),
  roughnessMap: cdsRough,
  roughness: 1.0,
  metalness: 0.0,
});

// Cement slab materials — one per variant
const slabMats = cemVariants.map(canvas => {
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.anisotropy = 16;
  return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85, metalness: 0.0 });
});

const matCurb = new THREE.MeshStandardMaterial({ color: 0xb0a890 });

// Load EXR normal map async — scene renders immediately without it
const exrLoader = new EXRLoader();
exrLoader.load(TEX + 'asphalt_02_nor_gl_4k.exr', (tex) => {
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = 16;

  tex.repeat.set(ROAD_REP_X, ROAD_REP_Y);
  matRoad.normalMap = tex;
  matRoad.needsUpdate = true;

  const cdsTex = tex.clone();
  cdsTex.repeat.set(CDS_REP, CDS_REP);
  cdsTex.needsUpdate = true;
  matCds.normalMap = cdsTex;
  matCds.needsUpdate = true;

  // Apply normal map to cross-street too (declared later, safe because this runs async)
  const mainNor = tex.clone();
  mainNor.repeat.set(MAIN_REP_U, MAIN_REP_V);
  mainNor.needsUpdate = true;
  matMainRoad.normalMap = mainNor;
  matMainRoad.needsUpdate = true;

  document.getElementById('loading').style.display = 'none';
}, undefined, () => {
  document.getElementById('loading').style.display = 'none';
});

/* ── GEOMETRY ── */

/* ── GROUND & PARCEL ── */

// Wide desert ground — covers everything outside the lot
const matDesert = new THREE.MeshStandardMaterial({
  color: 0xc4956a,   // warm desert sand/dirt
  roughness: 0.95,
  metalness: 0.0,
});
const groundPlaneGeo = new THREE.PlaneGeometry(3000, 3000);
groundPlaneGeo.rotateX(-Math.PI / 2);
const groundMesh = new THREE.Mesh(groundPlaneGeo, matDesert);
groundMesh.position.y = -0.10;
groundMesh.receiveShadow = true;
scene.add(groundMesh);

// Teardrop-shaped parcel — the Alva Court developed area
// Shape is defined in local 2D (X along road, Y → world-Z after rotateX)
const LOT_EDGE   = 90;                         // ft from road centerline to back-of-lot
const ENTRY_X    = -20;                        // ft to the left of road start
const ENTRY_HALF = ROAD_W / 2 + SW_W + 3;     // ~20 ft — just road + sidewalk + small margin

const parcelShape = new THREE.Shape();
parcelShape.moveTo(ENTRY_X, -ENTRY_HALF);
parcelShape.bezierCurveTo(30, -ENTRY_HALF, 70, -LOT_EDGE, 120, -LOT_EDGE);
parcelShape.lineTo(ROAD_LEN, -LOT_EDGE);
parcelShape.absarc(ROAD_LEN, 0, LOT_EDGE, -Math.PI / 2, Math.PI / 2, false);
parcelShape.lineTo(120, LOT_EDGE);
parcelShape.bezierCurveTo(70, LOT_EDGE, 30, ENTRY_HALF, ENTRY_X, ENTRY_HALF);
parcelShape.closePath();

const parcelGeo = new THREE.ShapeGeometry(parcelShape, 64);
parcelGeo.rotateX(-Math.PI / 2);
const matParcel = new THREE.MeshStandardMaterial({
  color: 0xd4b882,   // lighter sandy lot fill — distinct from open desert
  roughness: 0.95,
  metalness: 0.0,
});
const parcelMesh = new THREE.Mesh(parcelGeo, matParcel);
parcelMesh.position.y = -0.05;
parcelMesh.receiveShadow = true;
scene.add(parcelMesh);

// Straight road
const roadGeo = new THREE.PlaneGeometry(ROAD_LEN, ROAD_W, 1, 1);
roadGeo.rotateX(-Math.PI / 2);
roadGeo.translate(ROAD_LEN / 2, 0.01, 0);
const road = new THREE.Mesh(roadGeo, matRoad);
road.receiveShadow = true;
scene.add(road);

// Cul-de-sac — full asphalt, no concrete ring
const cdsGeo = new THREE.CircleGeometry(CDS_R, 64);
const uvs = cdsGeo.attributes.uv;
const positions = cdsGeo.attributes.position;
for (let i = 0; i < positions.count; i++) {
  uvs.setXY(i,
    (positions.getX(i) / (CDS_R * 2)) + 0.5,
    (positions.getY(i) / (CDS_R * 2)) + 0.5
  );
}
cdsGeo.rotateX(-Math.PI / 2);
cdsGeo.translate(ROAD_LEN, 0.01, 0);
const cds = new THREE.Mesh(cdsGeo, matCds);
cds.receiveShadow = true;
scene.add(cds);

// Concrete sidewalk slabs — ~68" squares, single file, thin weathered gaps
// 3 variant groups: 50% plain, 25% weathered overlay, 25% cracked overlay
const SLAB_SIZE = SW_W;
const SLAB_GAP  = 0.1;
const SLAB_STEP = SLAB_SIZE + SLAB_GAP;
const SLAB_COUNT = Math.floor(ROAD_LEN / SLAB_STEP);
const TOTAL_SLABS = SLAB_COUNT * 2;  // both sides

const slabGeo = new THREE.PlaneGeometry(SLAB_SIZE, SLAB_SIZE);
slabGeo.rotateX(-Math.PI / 2);

// Assign each slab to a variant using seeded RNG
const variantRng = seededRng(999);
const slabVariants = Array.from({ length: TOTAL_SLABS }, () => {
  const r = variantRng();
  return r < 0.50 ? 0 : r < 0.75 ? 1 : 2;
});

// Bucket slabs by variant
const buckets = [[], [], []];
const dummy = new THREE.Object3D();
let slabIdx = 0;
for (let side = -1; side <= 1; side += 2) {
  for (let i = 0; i < SLAB_COUNT; i++) {
    const pos = [
      SLAB_SIZE / 2 + i * SLAB_STEP,
      CURB_H,
      side * (ROAD_W / 2 + SW_W / 2)
    ];
    buckets[slabVariants[slabIdx]].push(pos);
    slabIdx++;
  }
}

// Create one InstancedMesh per variant
buckets.forEach((positions, vi) => {
  if (positions.length === 0) return;
  const mesh = new THREE.InstancedMesh(slabGeo, slabMats[vi], positions.length);
  mesh.receiveShadow = true;
  positions.forEach((pos, i) => {
    dummy.position.set(pos[0], pos[1], pos[2]);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  });
  mesh.instanceMatrix.needsUpdate = true;
  scene.add(mesh);
});

/* ── STEP 2: ENTRY CROSS-STREET & T-INTERSECTION ── */

const MAIN_W   = 26;   // ft — 2 × 13-ft lanes
const MAIN_LEN = 600;  // ft — 300 each direction in Z

// ── Cross-street surface — reuses composited asphalt canvas + local rough map ──
const MAIN_REP_U = MAIN_W   / TILE_SIZE;
const MAIN_REP_V = MAIN_LEN / TILE_SIZE;

const matMainRoad = new THREE.MeshStandardMaterial({
  map:          makeAsphaltTex(MAIN_REP_U, MAIN_REP_V),
  roughnessMap: loadRepeatTex(TEX + 'asphalt_02_rough_4k.jpg', MAIN_REP_U, MAIN_REP_V),
  roughness: 1.0,
  metalness: 0.0,
});

// PlaneGeometry(width, height) → after rotateX: width = X span, height = Z span
const mainRoadGeo = new THREE.PlaneGeometry(MAIN_W, MAIN_LEN);
mainRoadGeo.rotateX(-Math.PI / 2);
mainRoadGeo.translate(-MAIN_W / 2, 0.01, 0);  // right edge flush at x = 0
const mainRoadMesh = new THREE.Mesh(mainRoadGeo, matMainRoad);
mainRoadMesh.receiveShadow = true;
scene.add(mainRoadMesh);

// ── Dashed yellow centre-line overlays (canvas-generated, transparent) ──
// vertical=false → road runs in X (Alva Court)
// vertical=true  → road runs in Z (cross-street)
function makeCenterLineTex(roadW, tileLen, vertical, pxPerFt = 8) {
  const cw  = Math.round((vertical ? roadW  : tileLen) * pxPerFt);
  const ch  = Math.round((vertical ? tileLen : roadW ) * pxPerFt);
  const cv  = document.createElement('canvas');
  cv.width  = cw;  cv.height = ch;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, cw, ch);
  ctx.strokeStyle = '#ffe033';
  ctx.lineWidth   = Math.max(1, Math.round(0.5 * pxPerFt));  // ~6-inch stripe
  ctx.setLineDash([10 * pxPerFt, 20 * pxPerFt]);             // 10-ft dash / 20-ft gap
  ctx.beginPath();
  if (vertical) { ctx.moveTo(cw / 2, 0);  ctx.lineTo(cw / 2, ch); }
  else          { ctx.moveTo(0, ch / 2);  ctx.lineTo(cw, ch / 2); }
  ctx.stroke();
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

function markOverlay(geo, tex, renderOrder = 1) {
  const mat = new THREE.MeshBasicMaterial({
    map: tex, transparent: true, alphaTest: 0.05,
    depthWrite: false,
    polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -4,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.renderOrder = renderOrder;
  scene.add(mesh);
}

const MARK_TILE = 30;  // ft per repeating tile

// Alva Court centre line — road runs in X
const alvaCLTex = makeCenterLineTex(ROAD_W, MARK_TILE, false);
alvaCLTex.repeat.set(ROAD_LEN / MARK_TILE, 1);
const alvaMarkGeo = new THREE.PlaneGeometry(ROAD_LEN, ROAD_W);
alvaMarkGeo.rotateX(-Math.PI / 2);
alvaMarkGeo.translate(ROAD_LEN / 2, 0.03, 0);
markOverlay(alvaMarkGeo, alvaCLTex);

// Cross-street centre line — road runs in Z
const mainCLTex = makeCenterLineTex(MAIN_W, MARK_TILE, true);
mainCLTex.repeat.set(1, MAIN_LEN / MARK_TILE);
const mainMarkGeo = new THREE.PlaneGeometry(MAIN_W, MAIN_LEN);
mainMarkGeo.rotateX(-Math.PI / 2);
mainMarkGeo.translate(-MAIN_W / 2, 0.03, 0);
markOverlay(mainMarkGeo, mainCLTex);

// ── White stop bar at T-intersection mouth ──
// 2-ft wide white bar spanning Alva Court width, placed just before x = 0
{
  const geo = new THREE.PlaneGeometry(2, ROAD_W);
  geo.rotateX(-Math.PI / 2);
  geo.translate(-1, 0.035, 0);
  const mat = new THREE.MeshBasicMaterial({
    color: 0xffffff, depthWrite: false,
    polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -5,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.renderOrder = 2;
  scene.add(mesh);
}

// ── Curb pads at intersection mouth ──
// Concrete pads connecting Alva Court sidewalks to the main-street curb line.
// Uses local cement texture on top of the existing curb colour.
const curbCemTex = texLoader.load(CEM + 'cement-concrete-texture-copy-space.jpg');
curbCemTex.wrapS = curbCemTex.wrapT = THREE.RepeatWrapping;
curbCemTex.repeat.set(3, 1);
const matCurbTextured = new THREE.MeshStandardMaterial({
  map: curbCemTex, color: 0xb8a890, roughness: 0.9, metalness: 0.0,
});

[ ROAD_W / 2 + SW_W / 2,  -(ROAD_W / 2 + SW_W / 2) ].forEach(zOff => {
  const geo  = new THREE.BoxGeometry(MAIN_W / 2, CURB_H, SW_W);
  const mesh = new THREE.Mesh(geo, matCurbTextured);
  mesh.position.set(-MAIN_W / 4, CURB_H / 2, zOff);
  mesh.receiveShadow = true;
  mesh.castShadow    = true;
  scene.add(mesh);
});

/* ── STEP 3: LOT PARCELS & BUILDING FOOTPRINTS ── */

const LOT_FRONT = ROAD_W / 2 + SW_W;   // ≈17 ft — sidewalk outer edge
const SETBACK   = 22;                   // ft from lot front to house front face
const DW_W      = 14;                   // ft — driveway width

// ── Lot + house data ──
// z1 >= LOT_FRONT  → south side  (positive Z)
// z2 <= -LOT_FRONT → north side  (negative Z)
// else             → straddles Z=0 — back of cul-de-sac, house faces west
const lotDefs = [
  // South side — 4 lots
  { x1:  70, x2: 135, z1: LOT_FRONT, z2: 90,  hw: 44, hd: 36, hh: 14 },
  { x1: 135, x2: 195, z1: LOT_FRONT, z2: 90,  hw: 44, hd: 38, hh: 16 },
  { x1: 195, x2: 258, z1: LOT_FRONT, z2: 90,  hw: 42, hd: 36, hh: 14 },
  { x1: 258, x2: 322, z1: LOT_FRONT, z2: 90,  hw: 44, hd: 40, hh: 15 },
  // North side — 4 lots
  { x1:  70, x2: 135, z1: -90, z2: -LOT_FRONT, hw: 42, hd: 36, hh: 15 },
  { x1: 135, x2: 195, z1: -90, z2: -LOT_FRONT, hw: 44, hd: 38, hh: 14 },
  { x1: 195, x2: 258, z1: -90, z2: -LOT_FRONT, hw: 42, hd: 36, hh: 16 },
  { x1: 258, x2: 322, z1: -90, z2: -LOT_FRONT, hw: 40, hd: 38, hh: 14 },
  // Cul-de-sac south
  { x1: 322, x2: 393, z1:  CDS_R + 3, z2:  90, hw: 40, hd: 30, hh: 14 },
  // Cul-de-sac north
  { x1: 322, x2: 393, z1: -90, z2: -(CDS_R + 3), hw: 40, hd: 30, hh: 15 },
  // Cul-de-sac back (single lot, faces west)
  { x1: 395, x2: 447, z1: -40, z2:  40, hw: 32, hd: 30, hh: 14 },
];

// ── Lot fill — seeded sandy-desert colour family ──
const lotFillColors = [0xC9A87C, 0xCBAA7E, 0xC4A374, 0xD0AF84, 0xC6A578];
const lotRng     = seededRng(77);
const lotFillMats = lotFillColors.map(c =>
  new THREE.MeshStandardMaterial({ color: c, roughness: 0.95, metalness: 0 })
);

// ── Procedural grass canvas tiles (no external URL needed) ──
function makeGrassTex(seed) {
  const SZ  = 64;
  const cv  = document.createElement('canvas');
  cv.width  = cv.height = SZ;
  const ctx = cv.getContext('2d');
  const rng = seededRng(seed);
  ctx.fillStyle = '#5e8f3a';
  ctx.fillRect(0, 0, SZ, SZ);
  for (let i = 0; i < 600; i++) {
    const x = rng() * SZ, y = rng() * SZ, r = 1 + rng() * 2.5;
    const l = 28 + Math.floor(rng() * 28), s = 38 + Math.floor(rng() * 20);
    ctx.fillStyle = `hsl(110,${s}%,${l}%)`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(4, 4);
  return tex;
}
const grassRng  = seededRng(888);
const grassMats = [11, 22, 33].map(s => makeGrassTex(s)).map(t =>
  new THREE.MeshStandardMaterial({ map: t, roughness: 0.9, metalness: 0 })
);

// ── House wall texture — local: cement assets/painted-gray-wall.jpg ──
// Weathered plaster — tinted per house to read as desert stucco
const wallTex = texLoader.load('cement assets/painted-gray-wall.jpg');
wallTex.wrapS = wallTex.wrapT = THREE.RepeatWrapping;
wallTex.repeat.set(4, 2);

// Roof colours pulled from the aerial photo:
// terracotta orange, dark brown, warm tan, slate, russet
const wallTints = [0xF5E4C8, 0xEDD6B0, 0xF2DEC0, 0xE8CFA8, 0xF0DBC0];
const roofTints = [0xB05030, 0x4A3428, 0xC07840, 0x706860, 0x904030];

// Walls-only material array (no roof face — roof is a separate mesh)
function makeWallMats(wi, ri) {
  const wall = new THREE.MeshStandardMaterial({
    map: wallTex, color: wallTints[wi], roughness: 0.8, metalness: 0,
  });
  // Top of wall box uses roof colour so any gap is invisible
  const cap = new THREE.MeshStandardMaterial({ color: roofTints[ri], roughness: 0.9, metalness: 0 });
  const bot = new THREE.MeshStandardMaterial({ color: 0x888880 });
  return [wall, wall, cap, bot, wall, wall];
}

// ── Hip-roof geometry ──
// bW × bD footprint, rH tall.  Ridge runs along X when bW >= bD, else along Z.
function makeHipRoofGeo(bW, bD, rH) {
  // Ensure ridge runs along the longer axis
  const [W, D, rotated] = bW >= bD ? [bW, bD, false] : [bD, bW, true];
  const rl = (W - D) / 2;   // ridge half-length (≥0 by construction)
  const hw = W / 2, hd = D / 2;

  // 6 vertices: 4 eave corners + 2 ridge ends
  const pos = new Float32Array([
    -hw, 0,  hd,   // 0 sw
     hw, 0,  hd,   // 1 se
     hw, 0, -hd,   // 2 ne
    -hw, 0, -hd,   // 3 nw
    -rl, rH,  0,   // 4 west ridge
     rl, rH,  0,   // 5 east ridge
  ]);

  // CCW winding (outward normals after computeVertexNormals)
  const idx = new Uint16Array([
    0, 1, 5,  0, 5, 4,   // south slope
    3, 4, 5,  3, 5, 2,   // north slope
    0, 4, 3,             // west hip
    1, 2, 5,             // east hip
  ]);

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  g.computeVertexNormals();

  // Rotate 90° around Y so ridge aligns with the short axis when needed
  if (rotated) g.rotateY(Math.PI / 2);
  return g;
}

// ── Driveway — local cement texture, lighter tint ──
const dwTex = texLoader.load(CEM + 'cement-concrete-texture-copy-space.jpg');
dwTex.wrapS = dwTex.wrapT = THREE.RepeatWrapping;
dwTex.repeat.set(1.5, 2);
const matDW = new THREE.MeshStandardMaterial({
  map: dwTex, color: 0xC8BCA8, roughness: 0.88, metalness: 0,
});

// ── Build each lot ──
const houseRng = seededRng(555);

lotDefs.forEach(lot => {
  const { x1, x2, z1, z2, hw, hd, hh } = lot;
  const xc      = (x1 + x2) / 2;
  const isSouth = z1 >= LOT_FRONT - 0.1;
  const isNorth = z2 <= -(LOT_FRONT - 0.1);
  const isCDS   = !isSouth && !isNorth;

  // ── House centre ──
  let hx = xc, hz = 0;
  if      (isSouth) hz = z1 + SETBACK + hd / 2;
  else if (isNorth) hz = z2 - SETBACK - hd / 2;
  else              hx = x1 + SETBACK + hd / 2;   // CDS: faces west (−X)

  // ── Lot fill (full parcel rectangle) ──
  const fillGeo = new THREE.PlaneGeometry(x2 - x1, z2 - z1);
  fillGeo.rotateX(-Math.PI / 2);
  fillGeo.translate(xc, -0.03, (z1 + z2) / 2);
  const fillMat = lotFillMats[Math.floor(lotRng() * lotFillMats.length)];
  const fill = new THREE.Mesh(fillGeo, fillMat);
  fill.receiveShadow = true;
  scene.add(fill);

  // ── Front-yard grass strip (sidewalk edge → house front) ──
  if (!isCDS) {
    const fyLen = SETBACK;
    const fyZ   = isSouth ? z1 + fyLen / 2 : z2 - fyLen / 2;
    const fyGeo = new THREE.PlaneGeometry(x2 - x1, fyLen);
    fyGeo.rotateX(-Math.PI / 2);
    fyGeo.translate(xc, -0.02, fyZ);
    const fyMesh = new THREE.Mesh(fyGeo,
      grassMats[Math.floor(grassRng() * grassMats.length)]);
    fyMesh.receiveShadow = true;
    scene.add(fyMesh);
  }

  // ── House: walls box + hip roof ──
  const wi  = Math.floor(houseRng() * wallTints.length);
  const ri  = Math.floor(houseRng() * roofTints.length);
  const bW  = isCDS ? hd : hw;
  const bD  = isCDS ? hw : hd;
  const wH  = hh * 0.65;          // wall height  (~9 ft for hh=14)
  const rHt = hh * 0.50;          // roof height  (~7 ft — visible ridge from above)

  // Walls
  const walls = new THREE.Mesh(new THREE.BoxGeometry(bW, wH, bD), makeWallMats(wi, ri));
  walls.position.set(hx, wH / 2, hz);
  walls.castShadow = true;  walls.receiveShadow = true;
  scene.add(walls);

  // Hip roof — separate mesh, sits on top of walls
  const roofMat = new THREE.MeshStandardMaterial({
    color: roofTints[ri], roughness: 0.88, metalness: 0,
  });
  const roofMesh = new THREE.Mesh(makeHipRoofGeo(bW, bD, rHt), roofMat);
  roofMesh.position.set(hx, wH, hz);
  roofMesh.castShadow = true;  roofMesh.receiveShadow = true;
  scene.add(roofMesh);

  // ── Driveway approach ──
  if (!isCDS) {
    const dwZ   = isSouth ? z1 + SETBACK / 2 : z2 - SETBACK / 2;
    const dwGeo = new THREE.PlaneGeometry(DW_W, SETBACK);
    dwGeo.rotateX(-Math.PI / 2);
    dwGeo.translate(hx, 0.02, dwZ);
    const dw = new THREE.Mesh(dwGeo, matDW);
    dw.receiveShadow = true;
    scene.add(dw);
  }
});

/* ── LIGHTING — Desert Sun from Southeast ── */

const hemi = new THREE.HemisphereLight(0x87CEEB, 0xd4a76a, 0.5);
scene.add(hemi);

scene.add(new THREE.AmbientLight(0xffffff, 0.15));

const sun = new THREE.DirectionalLight(0xfff4e0, 1.8);
sun.position.set(250, 400, -200);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left   = -80;
sun.shadow.camera.right  = 460;
sun.shadow.camera.top    = 110;
sun.shadow.camera.bottom = -110;
sun.shadow.camera.near   = 100;
sun.shadow.camera.far    = 800;
sun.shadow.bias = -0.001;
scene.add(sun);

/* ── ANIMATION ── */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>

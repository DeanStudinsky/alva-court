<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alva Court — LiDAR + Houses</title>
<style>
  * { margin: 0; padding: 0; }
  body { overflow: hidden; background: #1a1a1a; }
  canvas { display: block; }
  #hud {
    position: absolute; top: 12px; left: 12px;
    color: #eee; font: 13px/1.5 monospace;
    background: rgba(0,0,0,0.8); padding: 12px;
    border-radius: 8px; pointer-events: none;
    border: 1px solid #444;
  }
  #hud b { color: #f0c040; }
  #loading {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #eee; font: 20px monospace;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="hud">
  <b>Alva Court — LiDAR terrain + stucco houses</b><br>
  • DTM bare-earth ground · USGS 3DEP 2021<br>
  • Houses: S1–S4 (south) · N1–N4 (north) · CS/CN/CB (cul-de-sac)<br>
  • Controls: Left=Orbit | Right=Pan | Scroll=Zoom
</div>
<div id="loading">Loading terrain…</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── TERRAIN DATA ──────────────────────────────────────────────────────────
   terrain.bin  Float32LE: [DSM 640×640 ft] then [DTM 640×640 ft] NAVD88
   Grid: 0.5 m cells · row 0 = south · col 0 = west
   UTM origin 548500 E / 3744020.5 N
   Scene origin = address 548660.3 E / 3744180.9 N → y = 0 at BASE_FT      */
const terrainBuf = await fetch('elevation/terrain.bin').then(r => r.arrayBuffer());
document.getElementById('loading').style.display = 'none';

const NC = 640, NR = 640;
const FT      = 3.280839895;
const CELL_FT = 0.5 * FT;                  // 1.6404 ft per cell
const BASE_FT = 399.57349381574863;         // DTM at address → scene y = 0

const dtm = new Float32Array(terrainBuf, NC * NR * 4, NC * NR);  // second half

const gridW   = NC * CELL_FT;
const gridH   = NR * CELL_FT;
const centerX = ((548500 + NC * 0.5 / 2) - 548660.3) * FT;   // ≈ −1 ft
const centerZ = -((3744020.5 + NR * 0.5 / 2) - 3744180.9) * FT; // ≈ +1 ft

// DTM elevation at any scene (x, z) — used to seat houses on real ground
function groundY(wx, wz) {
  const col = Math.round((wx - centerX + NC * CELL_FT / 2) / CELL_FT);
  const vr  = Math.round((wz - centerZ + NR * CELL_FT / 2) / CELL_FT);
  const row = NR - 1 - vr;   // vr=0 = north = grid row NR−1
  if (col < 0 || col >= NC || row < 0 || row >= NR) return 0;
  return dtm[row * NC + col] - BASE_FT;
}

/* ── SCENE ── */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 2000);
camera.position.set(90, 400, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(90, 0, -30);
controls.update();

// expose for console tinkering / tooling
Object.assign(window, { THREE, scene, camera, controls });

/* ── DTM TERRAIN (bare-earth ground) ── */
{
  const geo = new THREE.PlaneGeometry(gridW, gridH, NC - 1, NR - 1);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  for (let vr = 0; vr < NR; vr++) {
    const gridRow = NR - 1 - vr;
    for (let vc = 0; vc < NC; vc++) {
      pos.setY(vr * NC + vc, dtm[gridRow * NC + vc] - BASE_FT);
    }
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo,
    new THREE.MeshStandardMaterial({ color: 0xc4956a, roughness: 0.95, metalness: 0 }));
  mesh.position.set(centerX, 0, centerZ);
  mesh.receiveShadow = true;
  scene.add(mesh);
}

/* ── STUCCO WALLS ── */
const texLoader = new THREE.TextureLoader();
const stuccoTex = texLoader.load('cement assets/painted-gray-wall.jpg');
stuccoTex.wrapS = stuccoTex.wrapT = THREE.RepeatWrapping;
stuccoTex.repeat.set(3, 1);

const wallMat = new THREE.MeshStandardMaterial({
  map: stuccoTex, color: 0xF2DEC0, roughness: 0.82, metalness: 0,
});
const baseMat  = new THREE.MeshStandardMaterial({ color: 0x887766 });
// BoxGeometry face order: +x, −x, +y (roof), −y (base), +z, −z
// (the +y roof material is built per-house so each roof takes its real NAIP colour)

/* ── OPENING MATERIALS (doors / windows / garage) ── */
const glassMat  = new THREE.MeshStandardMaterial({ color: 0x243441, roughness: 0.12, metalness: 0.1 });
const frameMat  = new THREE.MeshStandardMaterial({ color: 0xf0ece2, roughness: 0.75 });
const doorMat   = new THREE.MeshStandardMaterial({ color: 0x4a3a2c, roughness: 0.6 });
const garageMat = new THREE.MeshStandardMaterial({ color: 0x9a958a, roughness: 0.65, metalness: 0.05 });

/* ── HOUSE DEFINITIONS ──────────────────────────────────────────────────────
   Coordinate system:  +x = east  ·  +z = south  ·  y = up
   Road centreline at approximately x: −137 → +213 ,  z ≈ −30
   Road south edge ≈ z = −19  ·  road north edge ≈ z = −41
   Positions estimated from housesonmystreet.png (east-up, cul-de-sac at top).
   All values in feet.  h = wall height only (roof added later).             */
const HOUSES = [
  // South side (z positive — south of road, lot front ≈ z −19)
  { id: 'S1', x:  -55, z:  30, w: 46, d: 38, h: 10 },
  { id: 'S2', x:   10, z:  28, w: 44, d: 38, h: 10 },
  { id: 'S3', x:   75, z:  26, w: 44, d: 36, h:  9 },
  { id: 'S4', x:  145, z:  24, w: 44, d: 36, h: 10 },

  // North side (z negative — north of road, lot front ≈ z −41)
  { id: 'N1', x:  -55, z: -85, w: 44, d: 36, h: 10 },
  { id: 'N2', x:   10, z: -83, w: 44, d: 38, h:  9 },
  { id: 'N3', x:   75, z: -82, w: 44, d: 36, h: 10 },
  { id: 'N4', x:  145, z: -80, w: 42, d: 38, h:  9 },

  // Cul-de-sac south flank
  { id: 'CS', x:  190, z:  14, w: 42, d: 32, h: 10 },
  // Cul-de-sac north flank
  { id: 'CN', x:  190, z: -74, w: 42, d: 32, h: 10 },
  // Cul-de-sac back (faces west)
  { id: 'CB', x:  232, z: -30, w: 32, d: 44, h:  9 },
];

/* Which wall faces the street?  Road runs along z ≈ −30 from x −137 → +213,
   bulb at the east end.  Snap the house→nearest-road vector to a box axis. */
const ROAD_Z = -30, ROAD_X0 = -137, ROAD_X1 = 213;
function frontAxis(x, z) {
  const rx = Math.max(ROAD_X0, Math.min(ROAD_X1, x));
  const dx = rx - x, dz = ROAD_Z - z;
  return Math.abs(dx) > Math.abs(dz) ? [Math.sign(dx) || 1, 0] : [0, Math.sign(dz) || -1];
}

/* Rough auto-colouring: each scene house borrows the roof colour of the nearest
   NAIP-registry house (elevation/houses.json). Registry N is north-positive;
   scene z is south-positive, so north maps to −z. */
let REG = [];
function roofColorFor(x, z) {
  if (!REG.length) return 0xB06040;
  let best = null, bd = 1e9;
  for (const hh of REG) {
    const ex = hh.centerLocalFt.E, nz = -hh.centerLocalFt.N;
    const dd = (ex - x) * (ex - x) + (nz - z) * (nz - z);
    if (dd < bd) { bd = dd; best = hh; }
  }
  return best ? (best.roofRGB[0] << 16) | (best.roofRGB[1] << 8) | best.roofRGB[2] : 0xB06040;
}

/* Doors, windows and a garage on the street-facing wall. Thin planes set proud
   of the stucco; a white frame plane sits just behind each glass/door panel. */
function addOpenings(x, z, w, d, h, gy) {
  const [fx, fz] = frontAxis(x, z);
  const eps = 0.12;
  const L     = fx !== 0 ? d : w;                       // lateral span of the front wall
  const faceX = fx !== 0 ? x + fx * (w / 2) : x;
  const faceZ = fz !== 0 ? z + fz * (d / 2) : z;
  const rotY  = fx > 0 ? Math.PI / 2 : fx < 0 ? -Math.PI / 2 : fz < 0 ? Math.PI : 0;
  const gW = Math.min(16, L * 0.4);
  // [ lateralFrac, sillY, width, height, kind ]
  const items = [
    [-0.26, 0,   gW,  7,   'garage'],
    [ 0.06, 0,   3.5, 7,   'door'],
    [ 0.28, 3.2, 4.2, 3.8, 'win'],
    [ 0.44, 3.2, 3.4, 3.6, 'win'],
  ];
  const addPlane = (ww, hh, mat, off, cx, cy, cz) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(ww, hh), mat);
    m.rotation.y = rotY;
    m.position.set(cx + (fx !== 0 ? fx * off : 0), cy, cz + (fz !== 0 ? fz * off : 0));
    m.receiveShadow = true;
    scene.add(m);
  };
  for (const [lf, sill, ow, oh, kind] of items) {
    if (sill + oh > h - 0.5) continue;                  // don't punch through the roofline
    const lat = lf * L;
    const cx = fx !== 0 ? faceX + fx * eps : x + lat;
    const cz = fz !== 0 ? faceZ + fz * eps : z + lat;
    const cy = gy + sill + oh / 2;
    if (kind === 'win')       { addPlane(ow + 0.6, oh + 0.6, frameMat, 0, cx, cy, cz); addPlane(ow, oh, glassMat,  0.04, cx, cy, cz); }
    else if (kind === 'door') { addPlane(ow + 0.5, oh + 0.3, frameMat, 0, cx, cy, cz); addPlane(ow, oh, doorMat,   0.04, cx, cy, cz); }
    else                      { addPlane(ow + 0.5, oh + 0.4, frameMat, 0, cx, cy, cz); addPlane(ow, oh, garageMat, 0.04, cx, cy, cz); }
  }
}

function buildHouses() {
  HOUSES.forEach(({ x, z, w, d, h }) => {
    const gy = groundY(x, z);
    const roofMat = new THREE.MeshStandardMaterial({ color: roofColorFor(x, z), roughness: 0.9 });
    const mats = [wallMat, wallMat, roofMat, baseMat, wallMat, wallMat];
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mats);
    mesh.position.set(x, gy + h / 2, z);
    mesh.castShadow = mesh.receiveShadow = true;
    scene.add(mesh);
    addOpenings(x, z, w, d, h, gy);
  });
}
// build after the roof-colour registry loads (falls back to placeholder colour if absent)
fetch('elevation/houses.json').then(r => r.json()).then(j => { REG = j.houses; }).catch(() => {}).then(buildHouses);

/* ── LIGHTING ── */
scene.add(new THREE.HemisphereLight(0x87CEEB, 0xd4a76a, 0.5));
scene.add(new THREE.AmbientLight(0xffffff, 0.15));

const sun = new THREE.DirectionalLight(0xfff4e0, 1.8);
sun.position.set(250, 400, -200);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left   = -600;
sun.shadow.camera.right  =  600;
sun.shadow.camera.top    =  600;
sun.shadow.camera.bottom = -600;
sun.shadow.camera.near   = 100;
sun.shadow.camera.far    = 1200;
sun.shadow.bias = -0.001;
scene.add(sun);

/* ── ANIMATE ── */
(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
})();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
